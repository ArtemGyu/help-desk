<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Help Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/tickets}">Help Desk Admin</a>
        <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-outline-light btn-sm" th:href="@{/tickets/new}">
                Создать заявку
            </a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Выйти
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Список заявок</h1>
            <p class="text-muted small mb-0">Закрытая зона администратора</p>
        </div>
        <span class="badge bg-primary fs-6 shadow-sm px-3 py-2"
              th:text="${#lists.size(tickets)} + ' заявок'">
            0 заявок
        </span>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="text-secondary small text-uppercase">ID</th>
                        <th scope="col" class="text-secondary small text-uppercase">Имя</th>
                        <th scope="col" class="text-secondary small text-uppercase">Тема</th>
                        <th scope="col" class="text-secondary small text-uppercase">Описание</th>
                        <th scope="col" class="text-secondary small text-uppercase">Статус</th>
                        <th scope="col" class="text-secondary small text-uppercase">Дата создания</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${ticket.id}" class="fw-bold text-secondary">1</td>
                        <td th:text="${ticket.customerName}">Иван</td>
                        <td th:text="${ticket.title}" class="fw-semibold">Не работает ПК</td>
                        <td th:text="${ticket.description}" class="text-muted">Описание</td>
                        <td>
                            <span class="badge bg-info text-dark px-2.5 py-1.5"
                                  th:text="${ticket.status}">NEW</span>
                        </td>
                        <td th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}" class="text-muted small">
                            01.01.2026 10:00
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</body>
</html>
