<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступ ограничен | Help Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .error-container {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Главная</a>
        </div>

</nav>

<main class="container error-container">

        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5 text-center">


                    <h1 class="display-6 fw-bold text-dark mb-2">403</h1>
                    <h3 class="h5 mb-3 text-secondary">Доступ ограничен</h3>
                    <p class="text-muted small mb-4">
                        У вас нет прав для просмотра администраторской зоны приложения Help Desk.
                    </p>

                    <a th:href="@{/}" class="btn btn-primary w-100 py-2" style="background:red;border-style:none">
